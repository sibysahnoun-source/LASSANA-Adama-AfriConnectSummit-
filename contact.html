<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription & Contact | AfriConnect Summit 2026</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="logo">AfriConnect Summit 2026</div>
        <nav>
            <a href="index.html">Accueil</a>
            <a href="programme.html">Programme</a>
            <a href="intervenants.html">Intervenants</a>
            <a href="contact.html" class="active">Inscription</a>
        </nav>
        <button id="theme-toggle">🌙 Mode Sombre</button>
    </header>

    <main class="page-container">
        <h1>Inscription & Contact</h1>
        <p class="breadcrumb"><a href="index.html">Accueil</a> > Contact</p>

        <div class="contact-layout">
            <!-- Formulaire d'inscription -->
            <section class="form-section">
                <h2>Réservez votre place</h2>
                <form id="registration-form">
                    <div class="form-group">
                        <label for="fullname">Nom complet *</label>
                        <input type="text" id="fullname" required placeholder="Votre nom complet">
                    </div>

                    <div class="form-group">
                        <label for="email">Adresse Email *</label>
                        <input type="email" id="email" required placeholder="exemple@domaine.com">
                    </div>

                    <div class="form-group">
                        <label for="phone">Téléphone *</label>
                        <input type="tel" id="phone" required placeholder="+221 ...">
                    </div>

                    <div class="form-group">
                        <label for="participation">Type de participation *</label>
                        <select id="participation" required>
                            <option value="">-- Choisir une option --</option>
                            <option value="presentiel">Présentiel</option>
                            <option value="en-ligne">En ligne (Virtuel)</option>
                            <option value="vip">Pass VIP</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="country">Pays africain d'origine *</label>
                        <select id="country" required>
                            <option value="">-- Sélectionner votre pays --</option>
                            <option value="senegal">Sénégal</option>
                            <option value="ghana">Ghana</option>
                            <option value="cote-divoire">Côte d'Ivoire</option>
                            <option value="cameroun">Cameroun</option>
                            <option value="autre">Autre</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="message">Lettre de motivation / Message *</label>
                        <textarea id="message" rows="4" required placeholder="Votre message (Min. 20 caractères)"></textarea>
                    </div>

                    <button type="submit" class="btn">Envoyer la demande</button>
                </form>
            </section>

            <!-- Infos Lieu -->
            <section class="location-section">
                <h2>Lieu de l'événement</h2>
                <p>📍 Centre International de Conférences Abdou Diouf (CICAD), Dakar</p>
                <div class="map-container">
                    <a href="https://maps.google.com" target="_blank" class="btn-secondary">Ouvrir dans Maps ↗</a>
                </div>
            </section>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 AfriConnect Summit. Tous droits réservés.</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
