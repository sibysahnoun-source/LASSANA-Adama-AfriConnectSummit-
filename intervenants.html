<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intervenants | AfriConnect Summit 2026</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <section class="internal-hero">
            <h1>Les Intervenants</h1>
            <nav class="breadcrumb" aria-label="Fil d'Ariane">
                <a href="index.html">Accueil</a> > <span>Intervenants</span>
            </nav>
        </section>

        <section id="filter-section">
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">Tous</button>
                <button class="filter-btn" data-filter="tech">IA & Tech</button>
                <button class="filter-btn" data-filter="business">Business</button>
                <button class="filter-btn" data-filter="design">Design</button>
                <button class="filter-btn" data-filter="data">Data</button>
            </div>
        </section>

        <section id="speakers-section">
            <div class="speakers-grid">
                
                <article class="speaker-card" data-category="tech">
                    <div class="speaker-img-wrapper">
                        <img src="images/istockphoto-1587604256-1024x1024.jpg" alt="Portrait de Dr. Aminata Touré">
                    </div>
                    <div class="speaker-info">
                        <h3>Dr. Aminata Touré</h3>
                        <p class="specialty">Experte en IA Émergente</p>
                        <p class="country"><i class="bi bi-geo-alt"></i> Sénégal</p>
                    </div>
                </article>

                <article class="speaker-card" data-category="business">
                    <div class="speaker-img-wrapper">
                        <img src="images/istockphoto-2234639448-1024x1024 (1).jpg" alt="Portrait de Samuel Eto'o">
                    </div>
                    <div class="speaker-info">
                        <h3>Kofi Mensah</h3>
                        <p class="specialty">Investisseur & VC Partner</p>
                        <p class="country"><i class="bi bi-geo-alt"></i> Ghana</p>
                    </div>
                </article>

                </div>
        </section>
    </main>

    </body>
</html>
